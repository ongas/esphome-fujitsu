esphome:
  name: fujitsu-firebeetle

esp32:
  board: dfrobot_firebeetle2_esp32e
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: components
    components: [fujitsu]

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome

web_server:
  port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "FujitsuFireBeetle"
    password: !secret ap_password

captive_portal:

climate:
  - platform: fujitsu
    id: fujitsu_climate
    name: "Fujitsu"
    rx_pin: 13
    tx_pin: 27
    en_pin: 25
    nrst_pin: 26
    status_sensor:
      name: "Fujitsu Connection Status"
    zones:
      - name: "Zone 1"
        zone_number: 1
      - name: "Zone 2"
        zone_number: 2
      - name: "Zone 3"
        zone_number: 3
      - name: "Zone 4"
        zone_number: 4
      - name: "Zone 5"
        zone_number: 5
      - name: "Zone 6"
        zone_number: 6
      - name: "Zone 7"
        zone_number: 7
      - name: "Zone 8"
        zone_number: 8
    zone_groups:
      - name: "Zone Group Day"
        group_type: DAY
      - name: "Zone Group Night"
        group_type: NIGHT
      - name: "Zone Group All"
        group_type: ALL
